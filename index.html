<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz culture politique</title>
<style>
  :root{
    --bg:#FEBF02;
    --card:#ffffff;
    --ink:#171717;
    --ink-soft:#6b6b6b;
    --line:#eee0b0;
    --ok:#1f9d55;
    --ko:#e0433d;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:12px;
    line-height:1.45;
  }
  .cab{
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:16px 20px 0;
  }
  .topbar .lbl{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .topbar .val{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
  .topbar .grp{text-align:left;}
  .topbar .grp.right{text-align:right;}

  .gauge{
    display:flex;
    gap:4px;
    padding:12px 20px 0;
  }
  .seg{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#f1e6c0;
  }
  .seg.done-ok{background:var(--ok);}
  .seg.done-ko{background:var(--ko);}
  .seg.current{background:var(--ink);}

  .timerwrap{padding:12px 20px 0;}
  .timerlabel{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .timerlabel #timeNum{color:var(--ink);font-weight:600;}
  .timerbar{
    height:5px;
    border-radius:3px;
    background:#f1e6c0;
    overflow:hidden;
  }
  .timerfill{
    height:100%;
    width:100%;
    background:var(--ink);
    border-radius:3px;
    transition:width 0.1s linear, background 0.2s;
  }

  .qarea{padding:16px 20px 6px;}
  .tag{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:500;
  }
  .question{
    font-size:16px;
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1.35;
  }

  .feedback-banner {
    margin: 8px 20px -4px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    transform: translateY(-5px);
    transition: all 0.2s ease;
  }
  .feedback-banner.show {
    opacity: 1;
    transform: translateY(0);
  }
  .feedback-banner.ok { background: #e7f6ec; color: var(--ok); }
  .feedback-banner.ko { background: #fbe9e8; color: var(--ko); }

  .answers{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:14px 20px 20px;
  }
  .ans{
    display:flex;
    gap:10px;
    align-items:center;
    min-height:48px;
    background:#faf7ec;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    text-align:left;
    padding:10px 14px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition:background 0.12s, border-color 0.12s, transform 0.08s;
  }
  .ans .k{color:var(--ink-soft);flex-shrink:0;font-weight:600;}
  .ans:disabled{cursor:default;}
  .ans.correct{
    background:#e7f6ec;
    border-color:var(--ok);
    color:#0d5c2e;
  }
  .ans.correct .k{color:#0d5c2e;}
  .ans.wrong{
    background:#fbe9e8;
    border-color:var(--ko);
    color:#8f1e1a;
  }
  .ans.wrong .k{color:#8f1e1a;}

  .points-pop{
    position:absolute;
    top:16px;
    right:20px;
    font-size:14px;
    font-weight:700;
    color:var(--ok);
    opacity:0;
  }
  .points-pop.show{animation:pop 0.9s ease forwards;}
  @keyframes pop{
    0%{opacity:0;transform:translateY(4px);}
    15%{opacity:1;transform:translateY(0);}
    75%{opacity:1;}
    100%{opacity:0;transform:translateY(-10px);}
  }

  .btn{
    width:100%;
    border:none;
    border-radius:12px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:15px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{transform:scale(0.98);}

  .screen{padding:32px 20px;text-align:center;}
  .screen h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-bottom:20px;
  }
  .screen .bigscore{
    font-size:44px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin-bottom:4px;
  }
  .screen .verdict{
    font-size:15px;
    color:var(--ink-soft);
    margin:14px 0 24px;
    padding:0 4px;
    line-height:1.4;
  }
  .screen .bestscore{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:24px;
  }
  .screen .bestscore span{color:var(--ink);font-weight:600;}
  .hidden{display:none !important;}

  .intro p{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:24px;
  }
</style>
</head>
<body>

<div class="cab" id="cab">

  <!-- INTRO -->
  <div id="screenIntro" class="screen intro">
    <h1>Quiz culture politique</h1>
    <p>10 questions tirées au hasard.<br>
    30 secondes par question.<br>
    50 points max — plus tu réponds vite juste, plus tu marques.</p>
    <div class="bestscore" id="introBest">Meilleur score : <span>0</span></div>
    <button class="btn" id="btnStart">Démarrer la partie</button>
  </div>

  <!-- GAME -->
  <div id="screenGame" class="hidden" style="position:relative;">
    <div class="points-pop" id="pointsPop">+0</div>
    <div class="topbar">
      <div class="grp"><div class="lbl">Score</div><div class="val" id="scoreVal">0</div></div>
      <div class="grp right"><div class="lbl">Meilleur</div><div class="val" id="bestVal">0</div></div>
    </div>
    <div class="gauge" id="gauge"></div>
    <div class="timerwrap">
      <div class="timerlabel"><span>Temps restant</span><span id="timeNum">30.0s</span></div>
      <div class="timerbar"><div class="timerfill" id="timerFill"></div></div>
    </div>
    <div class="qarea">
      <div class="tag"><span id="qTheme"></span> — <span id="qSurtitre"></span></div>
      <div class="question" id="qText"></div>
    </div>
    <div class="feedback-banner" id="feedbackBanner"></div>
    <div class="answers" id="answers"></div>
  </div>

  <!-- END -->
  <div id="screenEnd" class="hidden screen">
    <h1>Partie terminée</h1>
    <div class="bigscore" id="finalScore">0</div>
    <div class="verdict" id="finalVerdict"></div>
    <div class="bestscore">Meilleur score : <span id="finalBest">0</span></div>
    <button class="btn" id="btnReplay">Rejouer</button>
  </div>

</div>

<script>
const QUESTIONS = [
  {"id":"qcm_001","thème":"Histoire politique","surtitre":"Bye bye","question":"Pourquoi la passation de pouvoir entre Valéry Giscard d'Estaing et François Mitterrand le 21 mai 1981 est-elle restée célèbre à la télévision ?","propositions":["Giscard a refusé de serrer la main de Mitterrand avant de lui tourner le dos.","Giscard a terminé son allocution d'adieu par un long silence, un « Au revoir » solennel, puis s'est levé en laissant une chaise vide sur fond de Marseillaise.","Mitterrand est arrivé en retard à l'Élysée à cause d'une panne de sa 504 Peugeot.","La diffusion a été coupée par un documentaire animalier pendant 10 minutes, au moment où les deux hommes se sont serrés la main."],"reponse":"Giscard a terminé son allocution d'adieu par un long silence, un « Au revoir » solennel, puis s'est levé en laissant une chaise vide sur fond de Marseillaise."},
  {"id":"qcm_002","thème":"Histoire politique","surtitre":"Débat présidentiel","question":"Lors du débat de l'entre-deux-tours de la présidentielle de 1988 entre François Mitterrand et son Premier ministre de cohabitation Jacques Chirac, quelle réplique a marqué les esprits ?","propositions":["« Vous êtes le passé, je suis l'avenir. »","« Ce soir, vous n'êtes pas le Président et je ne suis pas le Premier ministre... Vous me permettrez de vous appeler Monsieur Mitterrand ? » — suivi d'une réplique cinglante : « Mais vous avez tout à fait raison, Monsieur le Premier ministre. »","« Vous me faites de la peine, Jacques. »","« La bave du crapaud n'atteint pas la blanche colombe. »"],"reponse":"« Ce soir, vous n'êtes pas le Président et je ne suis pas le Premier ministre... Vous me permettrez de vous appeler Monsieur Mitterrand ? » — suivi d'une réplique cinglante : « Mais vous avez tout à fait raison, Monsieur le Premier ministre. »"},
  {"id":"qcm_003","thème":"Histoire politique","surtitre":"Erreur tactique","question":"Quelle brillante idée tactique a eue Jacques Chirac au printemps 1997, alors qu'il disposait d'une majorité écrasante à l'Assemblée nationale ?","propositions":["Il a dissous l'Assemblée nationale pour « prendre de vitesse » la gauche... et a fini par perdre les législatives, se condamnant à cinq ans de cohabitation avec Lionel Jospin.","Il a démissionné pour se faire réélire dans la foulée.","Il a proposé d'accorder le droit de vote aux étrangers pour surprendre ses opposants.","Il a fait une alliance avec les socialistes pour étendre sa majorité mais son parti l'a lâché."],"reponse":"Il a dissous l'Assemblée nationale pour « prendre de vitesse » la gauche... et a fini par perdre les législatives, se condamnant à cinq ans de cohabitation avec Lionel Jospin."},
  {"id":"qcm_004","thème":"Histoire politique","surtitre":"Soir de défaite","question":"En 2002, après son élimination surprise dès le premier tour de l'élection présidentielle face à Jean-Marie Le Pen, quelle décision radicale Lionel Jospin a-t-il annoncée le soir même ?","propositions":["Il a annoncé son retrait définitif de la vie politique dès la fin de l'élection, laissant son parti sous le choc total.","Il a immédiatement appelé à voter pour Jacques Chirac en portant une cravate bleue.","Il a demandé un recomptage intégral des voix avant de s'enfermer à l'Hôtel de Matignon.","Il s'est envolé le soir même pour des vacances de trois mois à l'étranger."],"reponse":"Il a annoncé son retrait définitif de la vie politique dès la fin de l'élection, laissant son parti sous le choc total."},
  {"id":"qcm_005","thème":"Politique & Médias","surtitre":"Communication millimétrée","question":"En 2007, lors de son voyage officiel en Libye après la libération des infirmières bulgares, quelle initiative mémorable de Nicolas Sarkozy a suscité un vif émoi médiatique ?","propositions":["Il a invité Mouammar Kadhafi à planter sa tente bedouine dans les jardins de l'Hôtel de Marigny, en plein cœur de Paris.","Il a disputé une partie de baby-foot improvisée avec le colonel Kadhafi devant les caméras.","Il a oublié le protocole en tutoyant le dirigeant libyen en direct au journal de 20 heures.","Il a signé un traité de paix sur un sous-bock de café dans un hôtel de Tripoli."],"reponse":"Il a invité Mouammar Kadhafi à planter sa tente bedouine dans les jardins de l'Hôtel de Marigny, en plein cœur de Paris."},
  {"id":"qcm_006","thème":"Vaudeville politique","surtitre":"Guerre des chefs","question":"En novembre 2012, lors de l'élection du président de l'UMP entre Jean-François Copé et François Fillon, comment la crise s'est-elle soldée après des jours de comptages chaotiques et d'accusations de fraude ?","propositions":["Les deux candidats se sont proclamés vainqueurs le même soir, entraînant une scission temporaire du groupe parlementaire.","Le scrutin a été annulé et départagé par un tirage au sort à pile ou face.","Nicolas Sarkozy a repris la tête du parti dans la nuit en annulant les bulletins de vote.","Alain Juppé a fermé les portes du siège du parti à clé pour obliger les deux rivaux à négociation."],"reponse":"Les deux candidats se sont proclamés vainqueurs le même soir, entraînant une scission temporaire du groupe parlementaire."},
  {"id":"qcm_007","thème":"Histoire politique","surtitre":"Sens du timing","question":"En décembre 2016, François Hollande est devenu le premier président de la Ve République en exercice à renoncer à se présenter à sa propre succession. Pour quelle raison principale ?","propositions":["Ses niveaux d'impopularité records faisaient craindre une élimination humiliating de son camp dès le premier tour.","Il a préféré se présenter aux élections européennes pour présider la Commission.","Il souhaitait laisser le champ libre à Manuel Valls conformément à un pacte secret signé en 2012.","Son médecin de l'Élysée lui a formellement interdit de faire campagne pour des raisons de santé."],"reponse":"Ses niveaux d'impopularité records faisaient craindre une élimination humiliante de son camp dès le premier tour."},
  {"id":"qcm_008","thème":"Tactique politique","surtitre":"L'histoire se répète","question":"En juin 2024, au soir des résultats des élections européennes marquées par une forte poussée du Rassemblement National, quelle décision spectaculaire a prise Emmanuel Macron ?","propositions":["Il a prononcé la dissolution immédiate de l'Assemblée nationale, prenant de court son propre Premier ministre et sa majorité.","Il a proposé un gouvernement d'union nationale incluant tous les chefs de parti.","Il a annoncé un référendum sur la politique migratoire dans le mois suivant.","Il a démissionné de ses fonctions pour provoquer une élection présidentielle anticipée."],"reponse":"Il a prononcé la dissolution immédiate de l'Assemblée nationale, prenant de court son propre Premier ministre et sa majorité."},
  {"id":"qcm_009","thème":"Histoire politique","surtitre":"Punchline télévisuelle","question":"En 1974, lors du tout premier débat télévisé de l'entre-deux-tours de l'histoire présidentielle, quelle réplique cinglante Valéry Giscard d'Estaing assène-t-il à François Mitterrand ?","propositions":["« Vous n'avez pas le monopole du cœur. »","« Vous êtes le passé, je suis l'avenir. »","« Laissez-moi parler, monsieur Mitterrand ! »","« Vos promesses coûtent un pognon de dingue. »"],"reponse":"« Vous n'avez pas le monopole du cœur. »"},
  {"id":"qcm_010","thème":"Histoire politique","surtitre":"Incidents de parcours","question":"En 1920, le président Paul Deschanel doit démissionner quelques mois seulement après son élection. Quelle anecdote rocambolesque a précipité son départ de l'Élysée ?","propositions":["Il s'est trompé de discours et a lu sa lettre de démission à la Chambre des députés.","Il est tombé en pyjama d'un train de nuit roulant à faible allure et est allé toquer chez un garde-barrière effaré.","Il s'est enfermé par erreur dans la salle des coffres de la Banque de France pendant un week-end entier.","Il a été intercepté par des policiers alors qu'il tentait de fuir l'Élysée déguisé en garde républicain."],"reponse":"Il est tombé en pyjama d'un train de nuit roulant à faible allure et est allé toquer chez un garde-barrière effaré."},
  {"id":"qcm_011","thème":"Campagne électorale","surtitre":"Geste d'autorité","question":"En 2002, lors d'un déplacement de campagne électorale dans un quartier populaire de Strasbourg, quelle réaction spontanée du candidat François Bayrou face à un enfant fait scandale devant les caméras ?","propositions":["Il lui donne un billet de dix euros pour qu'il aille lui acheter des cigarettes.","Il lui administre une gifle monumentale après que le gamin a essayé de fouiller dans sa poche.","Il lui propose un stage non rémunéré à l'Élysée s'il accepte de faire sa campagne.","Il lui confisque son goûter sous les yeux des journalistes médusés."],"reponse":"Il lui administre une gifle monumentale après que le gamin a essayé de fouiller dans sa poche."},
  {"id":"qcm_012","thème":"Actualité politique","surtitre":"Sens de la formule","question":"En août 2024, quelle déclaration de Sébastien Lecornu sur les motions de censure de la gauche a provoqué l'indignation de Marine Tondelier et des écologistes ?","propositions":["Il a affirmé que la canicule était une invention médiatique de la gauche.","Il a ironisé en reprochant à la gauche d'avoir déposé des motions de censure « parce qu'il faisait chaud ».","Il a proposé d'annuler les sessions parlementaires au-delà de 30 degrés.","Il a accusé les députés écologistes de climatiser inutilement l'Assemblée nationale."],"reponse":"Il a ironisé en reprochant à la gauche d'avoir déposé des motions de censure « parce qu'il faisait chaud »."},
  {"id":"qcm_013","thème":"Société & Parlement","surtitre":"Combat parlementaire","question":"Quel sujet de société le député insoumis Aymeric Caron a-t-il défendu avec ferveur à l'Assemblée nationale à travers une proposition de loi antispéciste marquant les débats ?","propositions":["La protection juridique des moustiques en milieu urbain.","L'interdiction de l'extermination des rats dans les réseaux d'égouts.","L'abolition de la corrida sur l'ensemble du territoire français.","Le statut de réfugié politique pour les pigeons ramier du Palais-Bourbon."],"reponse":"L'abolition de la corrida sur l'ensemble du territoire français."},
  {"id":"qcm_014","thème":"Économie & Vie publique","surtitre":"Débat budgétaire","question":"Quelle mesure économique évoquée dans le cadre du plan budgétaire de l'été 2025 a suscité une vive opposition auprès des salariés et des syndicats ?","propositions":["La suppression éventuelle d'un ou plusieurs jours fériés.","L'obligation de privilégier la trottinette pour les déplacements domicile-travail.","La mise en place d'une taxe spécifique sur la pause café en entreprise.","L'instauration du travail obligatoire le dimanche après-midi."],"reponse":"La suppression éventuelle d'un ou plusieurs jours fériés."},
  {"id":"qcm_015","thème":"Vie politique","surtitre":"Mouvements & Partis","question":"Quel ancien Premier ministre a lancé en juin 2025 un mouvement politique baptisé « La France humaniste » ?","propositions":["Édouard Philippe","Jean Castex","Dominique de Villepin","Alain Juppé"],"reponse":"Dominique de Villepin"},
  {"id":"qcm_016","thème":"Histoire politique","surtitre":"Instabilité ministérielle","question":"Quel Premier ministre de la Ve République détient le record du mandat le plus court après avoir démissionné seulement 24 heures après la formation de son gouvernement en octobre 2025 ?","propositions":["Michel Barnier","François Bayrou","Sébastien Lecornu","Bernard Cazeneuve"],"reponse":"Sébastien Lecornu"},
  {"id":"qcm_017","thème":"Éducation & Société","surtitre":"Promesse ministérielle","question":"En 2023, lors de son passage au ministère de l'Éducation nationale, sur quel sujet concret Gabriel Attal s'est-il engagé à obtenir une réduction « de moitié d'ici 2024 » ?","propositions":["Le poids du cartable des élèves de primaire et de collège.","Le nombre hebdomadaire de devoirs à la maison.","La durée globale des cours de mathématiques.","Le tarif du pain au chocolat dans les cantines scolaires."],"reponse":"Le poids du cartable des élèves de primaire et de collège."},
  {"id":"qcm_018","thème":"Campagne électorale","surtitre":"Communication décalée","question":"Lors de la campagne présidentielle de 2022, quel candidat a marqué les esprits en prônant la gratuité des transports le week-end tout en partageant des recettes de cuisine du terroir en live ?","propositions":["Yannick Jadot","Jean-Luc Mélenchon","Fabien Roussel","Philippe Poutou"],"reponse":"Fabien Roussel"},
  {"id":"qcm_019","thème":"Mouvements sociaux","surtitre":"Symboles de contestation","question":"En avril 2023, lors du mouvement social contre la réforme des retraites, quel ustensile de cuisine est devenu le symbole des manifestations lors des déplacements ministériels et présidentiels ?","propositions":["Le fouet à pâtisserie","La casserole","La cocotte-minute","La poêle à crêpes"],"reponse":"La casserole"}
];

const PRAISES = [
  "Propre ! Même le Conseil Constitutionnel n'a rien à redire. ⚖️",
  "Machiavélique ! Tu as le sens de la tactique. 🧠",
  "Mieux qu'un porte-parole en conférence de presse ! 🎙️",
  "Niveau de culture politique : Élysée en vue ! 🏛️",
  "Brillant ! Pas besoin de fiche synthèse du ministère. 📄"
];

const TAUNTS = [
  "Même la diplomatie française n'aurait pas pu rattraper celle-là... 🤦‍♂️",
  "Un naufrage digne d'une dissolution mal préparée ! ⛵",
  "Faux ! Ton conseiller en communication vient de démissionner. 💼",
  "Aïe... Une bourde digne du JT de 20h en direct ! 📺",
  "Erreur tactique majeure ! La cour des comptes demande un audit. 📉"
];

const ROUND_LENGTH = 10;
const TIME_LIMIT = 30; // seconds
const MAX_POINTS = 50;
const STORAGE_KEY = "quizPolitiqueBestScore";

let roundQuestions = [];
let currentIndex = 0;
let score = 0;
let results = [];
let timerStart = null;
let timeLeft = TIME_LIMIT;
let timerRAF = null;
let answered = false;

const $ = (id) => document.getElementById(id);

function getBest(){
  return parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
}
function setBest(v){
  localStorage.setItem(STORAGE_KEY, String(v));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function getRandomPhrase(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function verdictFor(s){
  if(s <= 100) return "🚀 Même Jacques Cheminade visait les étoiles... toi tu n'as même pas décollé de la Terre !";
  if(s <= 200) return "🏡 Suffisant pour être élu 3ème adjoint au maire d'un village de 12 habitants dans le Poitou.";
  if(s <= 300) return "🥔 La campagne de François Bayrou en 2012 : c'est mou, c'est tiède, mais ça existe.";
  if(s <= 400) return "💥 Presque aussi percutant qu'un Philippe Poutou des grands soirs de débat télévisé !";
  return "👑 Tu fais quoi en 2027 ? On prépare ton QG de campagne dès demain !";
}

function buildGauge(){
  const g = $("gauge");
  g.innerHTML = "";
  for(let i=0;i<ROUND_LENGTH;i++){
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.id = "seg-"+i;
    g.appendChild(seg);
  }
}

function updateGauge(){
  for(let i=0;i<ROUND_LENGTH;i++){
    const seg = $("seg-"+i);
    seg.classList.remove("current","done-ok","done-ko");
    if(i < results.length){
      seg.classList.add(results[i] === "ok" ? "done-ok" : "done-ko");
    } else if(i === currentIndex){
      seg.classList.add("current");
    }
  }
}

function startGame(){
  roundQuestions = shuffle(QUESTIONS).slice(0, ROUND_LENGTH).map(q => {
    return {...q, shuffled: shuffle(q.propositions)};
  });
  currentIndex = 0;
  score = 0;
  results = [];
  $("scoreVal").textContent = "0";
  $("bestVal").textContent = getBest();
  buildGauge();
  $("screenIntro").classList.add("hidden");
  $("screenEnd").classList.add("hidden");
  $("screenGame").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  answered = false;
  const banner = $("feedbackBanner");
  banner.className = "feedback-banner";
  banner.textContent = "";

  const q = roundQuestions[currentIndex];
  $("qTheme").textContent = q["thème"];
  $("qSurtitre").textContent = q.surtitre;
  $("qText").textContent = q.question;
  updateGauge();

  const wrap = $("answers");
  wrap.innerHTML = "";
  const letters = ["A","B","C","D"];
  q.shuffled.forEach((prop, i) => {
    const btn = document.createElement("button");
    btn.className = "ans";
    btn.innerHTML = `<span class="k">${letters[i]}.</span><span>${prop}</span>`;
    btn.addEventListener("click", () => submitAnswer(prop, btn));
    wrap.appendChild(btn);
  });

  timeLeft = TIME_LIMIT;
  timerStart = performance.now();
  runTimer();
}

function runTimer(){
  cancelAnimationFrame(timerRAF);
  const fill = $("timerFill");
  fill.style.background = "var(--ink)";
  const tick = (now) => {
    if(answered) return;
    const elapsed = (now - timerStart) / 1000;
    timeLeft = Math.max(0, TIME_LIMIT - elapsed);
    $("timeNum").textContent = timeLeft.toFixed(1) + "s";
    fill.style.width = (timeLeft / TIME_LIMIT * 100) + "%";
    if(timeLeft <= TIME_LIMIT * 0.15) fill.style.background = "var(--ko)";
    if(timeLeft <= 0){
      submitAnswer(null, null);
      return;
    }
    timerRAF = requestAnimationFrame(tick);
  };
  timerRAF = requestAnimationFrame(tick);
}

function submitAnswer(chosen, btnEl){
  if(answered) return;
  answered = true;
  cancelAnimationFrame(timerRAF);

  const q = roundQuestions[currentIndex];
  const correct = chosen === q.reponse;
  let points = 0;
  if(correct){
    points = Math.round(MAX_POINTS * (timeLeft / TIME_LIMIT));
    points = Math.max(0, Math.min(MAX_POINTS, points));
  }
  score += points;
  results.push(correct ? "ok" : "ko");
  $("scoreVal").textContent = score;

  const banner = $("feedbackBanner");
  banner.textContent = correct ? getRandomPhrase(PRAISES) : getRandomPhrase(TAUNTS);
  banner.className = `feedback-banner show ${correct ? 'ok' : 'ko'}`;

  if(points > 0){
    const pop = $("pointsPop");
    pop.textContent = "+" + points;
    pop.classList.remove("show");
    void pop.offsetWidth;
    pop.classList.add("show");
  }

  document.querySelectorAll(".ans").forEach(b => {
    b.disabled = true;
    const label = b.querySelector("span:last-child").textContent;
    if(label === q.reponse){
      b.classList.add("correct");
    } else if(btnEl === b){
      b.classList.add("wrong");
    }
  });

  updateGauge();

  setTimeout(() => {
    currentIndex++;
    if(currentIndex >= roundQuestions.length){
      endGame();
    } else {
      showQuestion();
    }
  }, 1600);
}

function endGame(){
  $("screenGame").classList.add("hidden");
  const best = Math.max(getBest(), score);
  setBest(best);
  $("finalScore").textContent = score;
  $("finalVerdict").textContent = verdictFor(score);
  $("finalBest").textContent = best;
  $("screenEnd").classList.remove("hidden");
}

$("btnStart").addEventListener("click", startGame);
$("btnReplay").addEventListener("click", startGame);
$("introBest").querySelector("span").textContent = getBest();
</script>
</body>
